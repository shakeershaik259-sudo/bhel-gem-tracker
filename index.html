<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BHEL GeM Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #f9fafb;
            color: #111827;
        }
        header {
            background-color: #1e3a8a;
            color: white;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        header h1 {
            font-size: 18px;
            font-weight: 600;
        }
        .badge {
            background: #3b82f6;
            color: white;
            font-size: 12px;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: 500;
        }
        .search-container {
            padding: 16px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }
        .search-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
        }
        .search-input:focus {
            border-color: #2563eb;
        }
        .status-bar {
            padding: 8px 16px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #6b7280;
        }
        #bids-container {
            padding-bottom: 24px;
        }
    </style>
</head>
<body>

    <header>
        <h1>BHEL GeM Tracker</h1>
        <span class="badge">Live Feed</span>
    </header>

    <div class="search-container">
        <input type="text" id="searchInput" class="search-input" placeholder="Search tender ID, item, or unit...">
    </div>

    <div class="status-bar">
        <span id="statusText">Loading active bids...</span>
        <span>Synced just now</span>
    </div>

    <!-- Container where active BHEL tender cards are dynamically injected -->
    <div id="bids-container"></div>

    <!-- Main JavaScript module link -->
    <script type="module" src="app.js"></script>
</body>
</html>
